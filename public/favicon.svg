<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="deGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <!-- Outer luxury square / badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0A0A0D" stroke="#27272A" stroke-width="2"/>
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="url(#deGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Stylized Geometric "D" Monogram with Soundwave Cuts -->
  <g filter="url(#shadow)">
    <!-- Back Spine of D -->
    <rect x="18" y="16" width="6.5" height="32" rx="3" fill="url(#deGrad)"/>
    
    <!-- Outer Arc of D -->
    <path d="M22 16 H36 C44.5 16 50 21.5 50 32 C50 42.5 44.5 48 36 48 H22 Z" 
          fill="none" 
          stroke="url(#deGrad)" 
          stroke-width="6.5" 
          stroke-linejoin="round"/>
          
    <!-- Central Soundwave Diamond / Star -->
    <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>
    <path d="M32 24 L34 30 L40 32 L34 34 L32 40 L30 34 L24 32 L30 30 Z" fill="url(#goldGleam)"/>
  </g>
</svg>
